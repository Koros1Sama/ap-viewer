<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c2d" />
      <stop offset="100%" stop-color="#0b0e17" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="75%" y2="75%">
      <stop offset="0%" stop-color="#f5c464" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f5c464" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Dark base canvas -->
  <rect width="512" height="512" fill="#0b0e17"/>

  <!-- Luxury Badge matching .brand .lm in top corner -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#glowGrad)"/>

  <!-- Inner highlight -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Glowing accent border -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#f5c464" stroke-width="12" stroke-opacity="0.75"/>

  <!-- Symbol from .brand .lm -->
  <g fill="none" stroke="#f5c464" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(72, 72) scale(0.72)">
    <polyline points="160 156 68 256 160 356"/><polyline points="352 156 444 256 352 356"/><line x1="296" y1="120" x2="216" y2="392"/>
  </g>
</svg>